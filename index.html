<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CanaStream — Find what's streaming in Canada</title>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
  :root {
    --bg: #0b0d12;
    --panel: #151922;
    --panel-2: #1d2330;
    --text: #e8ecf3;
    --muted: #8b93a7;
    --accent: #e50914;
    --border: #262d3b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  a { color: inherit; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 24px 20px 60px; }
  header h1 { font-size: 28px; margin: 0 0 4px; letter-spacing: -0.5px; }
  header h1 .leaf { color: var(--accent); }
  header p { color: var(--muted); margin: 0 0 20px; font-size: 14px; }
  .keybar {
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 12px; padding: 12px 14px; margin-bottom: 16px;
  }
  .keybar label { font-size: 13px; color: var(--muted); }
  input[type="text"], input[type="password"] {
    background: var(--panel-2); border: 1px solid var(--border); color: var(--text);
    border-radius: 8px; padding: 10px 12px; font-size: 14px; outline: none;
  }
  input:focus { border-color: var(--accent); }
  .searchrow { display: flex; gap: 10px; margin-bottom: 14px; }
  .searchrow input { flex: 1; }
  button {
    background: var(--accent); color: #fff; border: none; border-radius: 8px;
    padding: 10px 18px; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  button.ghost { background: var(--panel-2); border: 1px solid var(--border); color: var(--text); font-weight: 500; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .tabs { display: flex; gap: 8px; margin-bottom: 14px; }
  .tabs button { background: var(--panel-2); border: 1px solid var(--border); color: var(--muted); font-weight: 500; }
  .tabs button.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 18px; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
    background: var(--panel-2); border: 1px solid var(--border); color: var(--muted);
    border-radius: 999px; padding: 7px 14px; font-size: 13px; user-select: none;
  }
  .chip.on { background: rgba(229,9,20,0.15); border-color: var(--accent); color: var(--text); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 16px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; }
  .poster { width: 100%; aspect-ratio: 2/3; object-fit: cover; background: var(--panel-2); }
  .noposter { display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 12px; text-align: center; padding: 10px; }
  .card .meta { padding: 10px 12px 12px; }
  .card .title { font-size: 14px; font-weight: 600; line-height: 1.3; margin: 0 0 4px; }
  .card .sub { font-size: 12px; color: var(--muted); margin: 0 0 8px; }
  .provs { display: flex; gap: 6px; flex-wrap: wrap; }
  .provs img { width: 26px; height: 26px; border-radius: 6px; }
  .provs .none { font-size: 11px; color: var(--muted); }
  .status { color: var(--muted); font-size: 14px; padding: 30px 0; text-align: center; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .hint a { color: var(--accent); text-decoration: none; }
  .badge { font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--muted); margin-bottom: 6px; }
  .spinner { border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; width: 26px; height: 26px; animation: spin 0.8s linear infinite; margin: 0 auto 10px; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useCallback } = React;

const API = "https://api.themoviedb.org/3";
const IMG = "https://image.tmdb.org/t/p/w342";
const LOGO = "https://image.tmdb.org/t/p/original";
const REGION = "CA";

// Target services with stable TMDB provider IDs (Canada)
const SERVICES = [
  { id: 8,   name: "Netflix" },
  { id: 337, name: "Disney+" },
  { id: 9,   name: "Prime Video" },
  { id: 230, name: "Crave" },
];

function useApiKey() {
  const [key, setKey] = useState("");
  return [key, setKey];
}

function Card({ item }) {
  const title = item.title || item.name;
  const date = item.release_date || item.first_air_date || "";
  const year = date ? date.slice(0, 4) : "";
  const type = item.media_type === "tv" || item.name ? "TV" : "Movie";
  const provs = item._providers || [];
  return (
    <div className="card">
      {item.poster_path
        ? <img className="poster" src={IMG + item.poster_path} alt={title} />
        : <div className="poster noposter">No image</div>}
      <div className="meta">
        <div className="badge">{type}{year ? " · " + year : ""}</div>
        <p className="title">{title}</p>
        <div className="provs">
          {provs.length
            ? provs.map(p => (
                <img key={p.provider_id} src={LOGO + p.logo_path}
                     title={p.provider_name} alt={p.provider_name} />
              ))
            : <span className="none">Not on selected services in CA</span>}
        </div>
      </div>
    </div>
  );
}

function App() {
  const [apiKey, setApiKey] = useApiKey();
  const [mode, setMode] = useState("search"); // "search" | "browse"
  const [query, setQuery] = useState("");
  const [selected, setSelected] = useState(new Set([8, 337, 9, 230]));
  const [results, setResults] = useState([]);
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState("");
  const [touched, setTouched] = useState(false);

  const toggle = (id) => {
    const next = new Set(selected);
    next.has(id) ? next.delete(id) : next.add(id);
    setSelected(next);
  };

  // Attach CA providers to a list of titles, then filter by selected services.
  const enrich = useCallback(async (items) => {
    const out = [];
    for (const it of items) {
      const media = (it.media_type === "tv" || (!it.title && it.name)) ? "tv" : "movie";
      try {
        const r = await fetch(`${API}/${media}/${it.id}/watch/providers?api_key=${apiKey}`);
        const d = await r.json();
        const ca = (d.results && d.results.CA) || {};
        const flat = ca.flatrate || [];
        const matched = flat.filter(p => selected.has(p.provider_id));
        it._providers = matched;
        it.media_type = media;
        out.push(it);
      } catch (e) {
        it._providers = [];
        out.push(it);
      }
    }
    return out;
  }, [apiKey, selected]);

  const runSearch = useCallback(async () => {
    if (!apiKey) { setError("Enter your TMDB API key first."); return; }
    setTouched(true); setError(""); setLoading(true); setResults([]);
    try {
      let items = [];
      if (mode === "search") {
        if (!query.trim()) { setLoading(false); return; }
        const r = await fetch(`${API}/search/multi?api_key=${apiKey}&query=${encodeURIComponent(query)}&region=${REGION}&include_adult=false`);
        const d = await r.json();
        if (d.status_code) throw new Error(d.status_message || "TMDB error");
        items = (d.results || []).filter(x => x.media_type === "movie" || x.media_type === "tv").slice(0, 20);
        const enriched = await enrich(items);
        setResults(enriched.filter(x => x._providers.length > 0));
      } else {
        // Browse: what's currently available on the selected services in Canada
        const ids = [...selected];
        if (!ids.length) { setError("Select at least one service."); setLoading(false); return; }
        const provParam = ids.join("|");
        const r = await fetch(`${API}/discover/movie?api_key=${apiKey}&watch_region=${REGION}&with_watch_providers=${provParam}&sort_by=popularity.desc&page=1`);
        const d = await r.json();
        if (d.status_code) throw new Error(d.status_message || "TMDB error");
        items = (d.results || []).slice(0, 20).map(x => ({ ...x, media_type: "movie" }));
        const enriched = await enrich(items);
        setResults(enriched);
      }
    } catch (e) {
      setError(e.message || "Something went wrong.");
    } finally {
      setLoading(false);
    }
  }, [apiKey, mode, query, selected, enrich]);

  return (
    <div className="wrap">
      <header>
        <h1><span className="leaf">🍁</span> CanaStream</h1>
        <p>Search titles streaming in Canada across Netflix, Disney+, Prime Video, and Crave.</p>
      </header>

      <div className="keybar">
        <label>TMDB API key</label>
        <input type="password" value={apiKey} onChange={e => setApiKey(e.target.value)}
               placeholder="paste your key" style={{ minWidth: 240 }} />
        <span className="hint">
          Free from <a href="https://www.themoviedb.org/settings/api" target="_blank" rel="noopener">themoviedb.org</a> (API Read → v3 key)
        </span>
      </div>

      <div className="tabs">
        <button className={mode === "search" ? "active" : ""} onClick={() => setMode("search")}>Search a title</button>
        <button className={mode === "browse" ? "active" : ""} onClick={() => setMode("browse")}>Browse by service</button>
      </div>

      {mode === "search" && (
        <div className="searchrow">
          <input type="text" value={query} placeholder="e.g. Schitt's Creek, Dune, The Bear"
                 onChange={e => setQuery(e.target.value)}
                 onKeyDown={e => e.key === "Enter" && runSearch()} />
          <button onClick={runSearch} disabled={loading}>Search</button>
        </div>
      )}

      <div className="chips">
        {SERVICES.map(s => (
          <span key={s.id} className={"chip" + (selected.has(s.id) ? " on" : "")}
                onClick={() => toggle(s.id)}>
            {selected.has(s.id) ? "✓ " : ""}{s.name}
          </span>
        ))}
      </div>

      {mode === "browse" && (
        <div style={{ marginBottom: 16 }}>
          <button onClick={runSearch} disabled={loading}>Show popular titles on selected services</button>
        </div>
      )}

      {loading && <div className="status"><div className="spinner"></div>Searching Canadian availability…</div>}
      {error && <div className="status" style={{ color: "#ff6b6b" }}>{error}</div>}
      {!loading && !error && touched && results.length === 0 &&
        <div className="status">No matches on the selected services in Canada.</div>}

      <div className="grid">
        {results.map(item => <Card key={(item.media_type || "m") + item.id} item={item} />)}
      </div>

      {!touched && !loading &&
        <div className="status">Enter your API key, pick your services, and search.</div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
