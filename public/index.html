<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CanaStream — Find what's streaming in Canada</title>
<!-- Maple-leaf favicon (inline SVG emoji — no separate asset to serve). -->
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20100%20100'%3E%3Ctext%20y='.9em'%20font-size='90'%3E%F0%9F%8D%81%3C/text%3E%3C/svg%3E" />
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
  :root {
    --bg: #0b0d12;
    --panel: #151922;
    --panel-2: #1d2330;
    --text: #e8ecf3;
    --muted: #8b93a7;
    --accent: #e50914;
    --border: #262d3b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--text);
    min-height: 100vh;
    background:
      radial-gradient(1100px 560px at 12% -12%, rgba(229,9,20,0.20), transparent 60%),
      radial-gradient(950px 650px at 100% -5%, rgba(37,99,235,0.18), transparent 55%),
      radial-gradient(1000px 900px at 50% 118%, rgba(139,92,246,0.16), transparent 60%),
      linear-gradient(180deg, #0b0d12 0%, #0a0c10 100%);
    background-attachment: fixed;
  }
  /* Faint film-strip texture over the whole page */
  body::before {
    content: "";
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    opacity: 0.05;
    background-image: url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='120'%20height='120'%3E%3Cg%20fill='%23ffffff'%3E%3Crect%20x='8'%20y='10'%20width='12'%20height='18'%20rx='3'/%3E%3Crect%20x='8'%20y='40'%20width='12'%20height='18'%20rx='3'/%3E%3Crect%20x='8'%20y='70'%20width='12'%20height='18'%20rx='3'/%3E%3Crect%20x='8'%20y='100'%20width='12'%20height='18'%20rx='3'/%3E%3Crect%20x='100'%20y='10'%20width='12'%20height='18'%20rx='3'/%3E%3Crect%20x='100'%20y='40'%20width='12'%20height='18'%20rx='3'/%3E%3Crect%20x='100'%20y='70'%20width='12'%20height='18'%20rx='3'/%3E%3Crect%20x='100'%20y='100'%20width='12'%20height='18'%20rx='3'/%3E%3C/g%3E%3C/svg%3E");
  }
  a { color: inherit; }
  .wrap { position: relative; z-index: 1; max-width: 1100px; margin: 0 auto; padding: 40px 20px 60px; }
  header h1 {
    font-size: 34px; margin: 0 0 6px; letter-spacing: -0.6px; font-weight: 800;
    background: linear-gradient(90deg, #fff 0%, #ffd7d9 40%, var(--accent) 100%);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  }
  header h1 .leaf { -webkit-text-fill-color: initial; }
  header p { color: var(--muted); margin: 0 0 22px; font-size: 14px; }
  .keybar {
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 12px; padding: 12px 14px; margin-bottom: 16px;
  }
  .keybar label { font-size: 13px; color: var(--muted); }
  input[type="text"], input[type="password"] {
    background: var(--panel-2); border: 1px solid var(--border); color: var(--text);
    /* 16px keeps iOS Safari from auto-zooming the page when the field is tapped. */
    border-radius: 8px; padding: 10px 12px; font-size: 16px; outline: none;
  }
  input:focus { border-color: var(--accent); }
  select.sel {
    background: var(--panel-2); border: 1px solid var(--border); color: var(--text);
    border-radius: 8px; padding: 8px 10px; font-size: 16px; outline: none; cursor: pointer;
  }
  select.sel:focus { border-color: var(--accent); }
  .searchrow { display: flex; gap: 10px; margin-bottom: 14px; }
  .searchrow input { flex: 1; }
  button {
    background: var(--accent); color: #fff; border: none; border-radius: 8px;
    padding: 10px 18px; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  button.ghost { background: var(--panel-2); border: 1px solid var(--border); color: var(--text); font-weight: 500; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .tabs { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
  .tabs button { background: var(--panel-2); border: 1px solid var(--border); color: var(--muted); font-weight: 500; }
  .tabs button.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 18px; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
    background: var(--panel-2); border: 1px solid var(--border); color: var(--muted);
    border-radius: 999px; padding: 7px 14px; font-size: 13px; user-select: none;
  }
  .chip.on { background: rgba(229,9,20,0.15); border-color: var(--accent); color: var(--text); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 16px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; }
  .poster { width: 100%; aspect-ratio: 2/3; object-fit: cover; background: var(--panel-2); }
  .noposter { display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 12px; text-align: center; padding: 10px; }
  .card .meta { padding: 10px 12px 12px; }
  .card .title { font-size: 14px; font-weight: 600; line-height: 1.3; margin: 0 0 4px; }
  .card .sub { font-size: 12px; color: var(--muted); margin: 0 0 8px; }
  .card .coming { font-size: 11px; font-weight: 700; color: #4ade80; margin: -2px 0 6px; }
  .provs { display: flex; gap: 8px; flex-wrap: wrap; }
  .prov { display: flex; flex-direction: column; align-items: center; gap: 3px; width: 44px; }
  .prov img { width: 30px; height: 30px; border-radius: 6px; }
  .prov .offer { font-size: 9px; line-height: 1; text-align: center; padding: 2px 4px; border-radius: 4px; white-space: nowrap; }
  .prov .offer.incl { background: rgba(52,199,89,0.16); color: #4ade80; }
  .prov .offer.paid { background: rgba(255,159,10,0.16); color: #fbbf24; }
  .provs .none { font-size: 11px; color: var(--muted); }
  .prov.plex { width: auto; justify-content: center; }
  .prov.plex .pill {
    display: inline-flex; align-items: center; height: 30px; padding: 0 10px;
    border-radius: 6px; font-size: 11px; font-weight: 700; letter-spacing: 0.3px;
    background: #1f1300; color: #e5a00d; border: 1px solid #e5a00d;
  }
  .chip.plexchip.on { background: rgba(229,160,13,0.15); border-color: #e5a00d; }
  .costbar { display: flex; align-items: center; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; }
  .costbar .lbl { font-size: 12px; color: var(--muted); }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .seg button { background: var(--panel-2); color: var(--muted); border: none; border-right: 1px solid var(--border); border-radius: 0; padding: 7px 14px; font-size: 13px; font-weight: 500; }
  .seg button:last-child { border-right: none; }
  .seg button.active { background: var(--accent); color: #fff; }
  .status { color: var(--muted); font-size: 14px; padding: 30px 0; text-align: center; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .hint a { color: var(--accent); text-decoration: none; }
  .badge { font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--muted); margin-bottom: 6px; }
  .spinner { border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; width: 26px; height: 26px; animation: spin 0.8s linear infinite; margin: 0 auto 10px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  /* Card is clickable -> opens the detail drawer */
  .card { cursor: pointer; transition: transform 0.12s ease, border-color 0.12s ease; }
  .card:hover { transform: translateY(-2px); border-color: var(--accent); }
  /* Slide-out detail drawer */
  .backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.62); z-index: 40; opacity: 0; animation: fade 0.2s ease forwards; }
  @keyframes fade { to { opacity: 1; } }
  .drawer {
    position: fixed; top: 0; right: 0; height: 100%; height: 100dvh; width: min(520px, 100%);
    background: var(--panel); border-left: 1px solid var(--border); z-index: 50;
    overflow-y: auto; -webkit-overflow-scrolling: touch;
    box-shadow: -20px 0 60px rgba(0,0,0,0.5);
    transform: translateX(100%); animation: slidein 0.25s ease forwards;
  }
  @keyframes slidein { to { transform: translateX(0); } }
  .drawer .dhead { position: relative; background: var(--panel-2); }
  .drawer .backdropimg { display: block; width: 100%; aspect-ratio: 16/9; object-fit: cover; }
  .drawer .close {
    position: absolute; top: 12px; right: 12px; width: 34px; height: 34px;
    border-radius: 50%; background: rgba(0,0,0,0.6); color: #fff; border: none;
    font-size: 18px; line-height: 1; cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  .dbody { padding: 18px 20px 44px; }
  .dbody h2 { margin: 0 0 6px; font-size: 22px; letter-spacing: -0.3px; }
  .dmeta { color: var(--muted); font-size: 13px; margin: 0 0 14px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .dmeta .rating { color: #fbbf24; font-weight: 700; }
  .genrow { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
  .genre { font-size: 11px; background: var(--panel-2); border: 1px solid var(--border); border-radius: 999px; padding: 4px 10px; color: var(--muted); }
  .overview { font-size: 14px; line-height: 1.55; margin: 0 0 18px; }
  .tagline { font-style: italic; color: var(--muted); margin: 0 0 12px; font-size: 14px; }
  .trailer { position: relative; width: 100%; aspect-ratio: 16/9; border-radius: 10px; overflow: hidden; margin-bottom: 18px; background: #000; }
  .trailer iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .sect { font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--muted); margin: 0 0 8px; }
  .cast { font-size: 13px; color: var(--muted); line-height: 1.5; margin: 0 0 18px; }
  .tmdblink { display: inline-block; font-size: 13px; color: var(--accent); text-decoration: none; }
  .dloading { padding: 40px 0; text-align: center; color: var(--muted); }

  /* Tablet / iPad: a touch less side padding, slightly narrower cards. */
  @media (max-width: 820px) {
    .wrap { padding: 28px 16px 48px; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
  }

  /* Phone / iPhone: comfortable two-up grid, full-width controls, bigger taps. */
  @media (max-width: 560px) {
    .wrap { padding: 20px 12px 44px; }
    header h1 { font-size: 27px; }
    .grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
    /* Tabs and segmented cost control each split the row evenly. */
    .tabs button { flex: 1 1 auto; }
    .seg { display: flex; width: 100%; }
    .seg button { flex: 1; padding: 10px 8px; }
    /* Larger touch targets on chips and the drawer close button. */
    .chip { padding: 9px 15px; font-size: 14px; }
    .drawer .close { width: 40px; height: 40px; font-size: 20px; }
    .dbody { padding: 16px 16px 40px; }
    .dbody h2 { font-size: 20px; }
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useCallback, useRef } = React;

const API = "https://api.themoviedb.org/3";
const IMG = "https://image.tmdb.org/t/p/w342";
const LOGO = "https://image.tmdb.org/t/p/original";
const BACKDROP = "https://image.tmdb.org/t/p/w780";
const REGION = "CA";

// Format a YYYY-MM-DD date as e.g. "Jul 30, 2026" for the Upcoming tab.
function fmtDate(s) {
  if (!s) return "";
  const d = new Date(s + "T00:00:00");
  if (isNaN(d.getTime())) return s;
  return d.toLocaleDateString("en-CA", { month: "short", day: "numeric", year: "numeric" });
}

// Choose the best YouTube trailer from a TMDB videos payload: prefer official
// Trailers, then Teasers, then anything else on YouTube.
function pickTrailer(videos) {
  const vids = (videos && videos.results) || [];
  const yt = vids.filter(v => v.site === "YouTube" && v.key);
  const score = (v) => (v.type === "Trailer" ? 2 : v.type === "Teaser" ? 1 : 0) + (v.official ? 0.5 : 0);
  yt.sort((a, b) => score(b) - score(a));
  return yt[0] || null;
}

// TMDB offer categories → friendly labels shown on each result.
const CAT_LABEL = { flatrate: "Included", free: "Free", ads: "Free · ads", rent: "Rent", buy: "Buy" };
// Priority when a provider offers a title several ways (best/cheapest first).
const PRIORITY = ["flatrate", "free", "ads", "rent", "buy"];
const FREE_CATS = ["flatrate", "free", "ads"]; // included with a subscription / no extra cost
const PAID_CATS = ["rent", "buy"];             // pay per title

function catsForFilter(costFilter) {
  if (costFilter === "free") return FREE_CATS;
  if (costFilter === "paid") return PAID_CATS;
  return PRIORITY; // both
}
// TMDB discover monetization param for the given cost filter (browse mode).
function monetizationParam(costFilter) {
  if (costFilter === "free") return "flatrate|free|ads";
  if (costFilter === "paid") return "rent|buy";
  return "flatrate|free|ads|rent|buy";
}

// Target services with stable TMDB provider IDs (Canada)
const SERVICES = [
  { id: 8,   name: "Netflix" },
  { id: 337, name: "Disney+" },
  { id: 9,   name: "Prime Video" },
  { id: 230, name: "Crave" },
  { id: 350, name: "Apple TV+" },
  { id: 192, name: "YouTube" },
];

// Sentinel "service" id for a personal Plex library. Never sent to TMDB;
// used only for client-side filtering + badging.
const PLEX_ID = "plex";

// Plex search responses vary by server version. Flatten the common shapes
// (Hub[].Metadata, SearchResult[].Metadata, top-level Metadata) into a list.
function extractPlexItems(d) {
  const mc = d && d.MediaContainer;
  if (!mc) return [];
  let out = [];
  const push = (arr) => { if (Array.isArray(arr)) out = out.concat(arr); };
  if (Array.isArray(mc.Hub)) mc.Hub.forEach(h => { push(h.Metadata); push(h.Directory); });
  push(mc.Metadata);
  if (Array.isArray(mc.SearchResult)) {
    mc.SearchResult.forEach(s => { if (s.Metadata) out.push(s.Metadata); });
  }
  return out;
}

const normTitle = (t) => (t || "").toLowerCase().replace(/[^a-z0-9]+/g, " ").trim();

// Does a title exist in the Plex library? Matches on normalized title + year
// (±1) and media type. Returns false on any error so Plex never breaks search.
async function isOnPlex(title, year, mediaType) {
  try {
    const r = await fetch(`/api/plex?query=${encodeURIComponent(title)}`);
    if (!r.ok) return false;
    const items = extractPlexItems(await r.json());
    const nt = normTitle(title);
    const wantType = mediaType === "tv" ? "show" : "movie";
    return items.some(m => {
      const mt = normTitle(m.title);
      const titleOk = mt && (mt === nt || mt.includes(nt) || nt.includes(mt));
      const yearOk = !year || !m.year || Math.abs(Number(m.year) - Number(year)) <= 1;
      const typeOk = !m.type || m.type === wantType;
      return titleOk && yearOk && typeOk;
    });
  } catch (e) {
    return false;
  }
}

function useApiKey() {
  const [key, setKey] = useState("");
  return [key, setKey];
}

function Card({ item, onOpen }) {
  const title = item.title || item.name;
  const date = item.release_date || item.first_air_date || "";
  const year = date ? date.slice(0, 4) : "";
  const type = item.media_type === "tv" || item.name ? "TV" : "Movie";
  const provs = item._providers || [];
  return (
    <div className="card" onClick={() => onOpen(item)}
         title={"View details for " + title}>
      {item.poster_path
        ? <img className="poster" src={IMG + item.poster_path} alt={title} />
        : <div className="poster noposter">No image</div>}
      <div className="meta">
        <div className="badge">{type}{year ? " · " + year : ""}</div>
        {item._upcoming && <div className="coming">📅 {fmtDate(item._upcoming)}</div>}
        <p className="title">{title}</p>
        <div className="provs">
          {item._onPlex && (
            <div className="prov plex" title="In your Plex library">
              <span className="pill">▶ Plex</span>
            </div>
          )}
          {provs.map(p => (
            <div key={p.provider_id} className="prov" title={p.provider_name + " · " + p.offer}>
              <img src={LOGO + p.logo_path} alt={p.provider_name} />
              <span className={"offer " + (p.paid ? "paid" : "incl")}>{p.offer}</span>
            </div>
          ))}
          {!provs.length && !item._onPlex &&
            <span className="none">Not on selected services in CA</span>}
        </div>
      </div>
    </div>
  );
}

function Detail({ item, data, loading, onClose }) {
  const title = item.title || item.name;
  const date = item.release_date || item.first_air_date || "";
  const year = date ? date.slice(0, 4) : "";
  const type = item.media_type === "tv" ? "TV" : "Movie";
  const provs = item._providers || [];

  const trailer = data ? pickTrailer(data.videos) : null;
  const genres = (data && data.genres) || [];
  const overview = (data && data.overview) || item.overview || "";
  const rating = (data && data.vote_average) || item.vote_average || 0;
  const runtime = data && data.runtime ? data.runtime + " min" : "";
  const seasons = data && data.number_of_seasons ? data.number_of_seasons + " season" + (data.number_of_seasons > 1 ? "s" : "") : "";
  const cast = (data && data.credits && data.credits.cast || []).slice(0, 6).map(c => c.name);
  const backImg = (data && data.backdrop_path) || item.backdrop_path;
  const tmdbUrl = `https://www.themoviedb.org/${item.media_type === "tv" ? "tv" : "movie"}/${item.id}`;

  return (
    <div>
      <div className="backdrop" onClick={onClose}></div>
      <div className="drawer" role="dialog" aria-label={title}>
        <div className="dhead">
          {(backImg || item.poster_path) &&
            <img className="backdropimg" alt="" src={BACKDROP + (backImg || item.poster_path)} />}
          <button className="close" onClick={onClose} aria-label="Close">✕</button>
        </div>
        <div className="dbody">
          <h2>{title}</h2>
          <div className="dmeta">
            <span>{type}</span>
            {year && <span>· {year}</span>}
            {(runtime || seasons) && <span>· {runtime || seasons}</span>}
            {rating > 0 && <span className="rating">★ {rating.toFixed(1)}</span>}
          </div>

          {loading && <div className="dloading"><div className="spinner"></div>Loading details…</div>}

          {!loading && data && data.tagline && <p className="tagline">"{data.tagline}"</p>}

          {!loading && trailer && (
            <div className="trailer">
              <iframe src={`https://www.youtube.com/embed/${trailer.key}`}
                      title="Trailer" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                      allowFullScreen></iframe>
            </div>
          )}

          {genres.length > 0 && (
            <div className="genrow">{genres.map(g => <span key={g.id} className="genre">{g.name}</span>)}</div>
          )}

          {overview && <p className="overview">{overview}</p>}

          {(provs.length > 0 || item._onPlex) && (
            <div style={{ marginBottom: 18 }}>
              <p className="sect">Where to watch (Canada)</p>
              <div className="provs">
                {item._onPlex && (
                  <div className="prov plex" title="In your Plex library"><span className="pill">▶ Plex</span></div>
                )}
                {provs.map(p => (
                  <div key={p.provider_id} className="prov" title={p.provider_name + " · " + p.offer}>
                    <img src={LOGO + p.logo_path} alt={p.provider_name} />
                    <span className={"offer " + (p.paid ? "paid" : "incl")}>{p.offer}</span>
                  </div>
                ))}
              </div>
            </div>
          )}

          {cast.length > 0 && (
            <div>
              <p className="sect">Cast</p>
              <p className="cast">{cast.join(", ")}</p>
            </div>
          )}

          {!loading && !trailer && data &&
            <p className="cast" style={{ marginBottom: 14 }}>No trailer available.</p>}

          <a className="tmdblink" href={tmdbUrl} target="_blank" rel="noopener">View on TMDB ↗</a>
        </div>
      </div>
    </div>
  );
}

function App() {
  const [apiKey, setApiKey] = useApiKey();
  const [mode, setMode] = useState("search"); // "search" | "browse" | "trending"
  const [query, setQuery] = useState("");
  const [selected, setSelected] = useState(new Set([8, 337, 9, 230, 350, 192, PLEX_ID]));
  const [results, setResults] = useState([]);
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState("");
  const [touched, setTouched] = useState(false);
  const [useProxy, setUseProxy] = useState(false);
  const [plexEnabled, setPlexEnabled] = useState(false);
  const [costFilter, setCostFilter] = useState("both"); // "free" | "paid" | "both"
  const [genre, setGenre] = useState("");     // TMDB genre id as string ("" = all)
  const [minScore, setMinScore] = useState(0); // minimum TMDB vote_average (0 = any)
  const [genres, setGenres] = useState([]);    // {id, name} list for the dropdown
  const [detail, setDetail] = useState(null);       // the item shown in the drawer
  const [detailData, setDetailData] = useState(null); // fetched TMDB details
  const [detailLoading, setDetailLoading] = useState(false);
  // Monotonic id for the in-flight search. Each runSearch captures the id at
  // start; only the latest is allowed to write results. This prevents a slow
  // earlier query (e.g. "the be…") from clobbering a newer one ("the bear")
  // when its enrich() fetches resolve out of order.
  const reqRef = useRef(0);

  // Detect the Cloudflare Worker proxy that holds the key server-side.
  // If present (200), we never ask for a key. If not (503/404/offline file://),
  // we fall back to manual entry.
  useEffect(() => {
    let alive = true;
    fetch("/api/tmdb?path=/configuration")
      .then(r => { if (alive && r.ok) setUseProxy(true); })
      .catch(() => {});
    // Probe the Plex proxy (no query = config check). 200 => secrets are set.
    fetch("/api/plex")
      .then(r => { if (alive && r.ok) setPlexEnabled(true); })
      .catch(() => {});
    return () => { alive = false; };
  }, []);

  // Single gateway to TMDB: via the secure proxy when available, otherwise
  // directly with the user-entered key.
  const tmdbGet = useCallback((path, params = {}) => {
    const qs = new URLSearchParams(params);
    if (useProxy) {
      qs.set("path", path);
      return fetch(`/api/tmdb?${qs.toString()}`);
    }
    qs.set("api_key", apiKey);
    return fetch(`${API}${path}?${qs.toString()}`);
  }, [useProxy, apiKey]);

  // Load TMDB's movie + TV genre names once (merged, de-duped) for the filter
  // dropdown. Re-runs if tmdbGet changes (e.g. once the proxy is detected).
  useEffect(() => {
    let alive = true;
    Promise.all([
      tmdbGet(`/genre/movie/list`).then(r => r.json()).catch(() => ({})),
      tmdbGet(`/genre/tv/list`).then(r => r.json()).catch(() => ({})),
    ]).then(([m, t]) => {
      if (!alive) return;
      const map = new Map();
      [...((m && m.genres) || []), ...((t && t.genres) || [])].forEach(g => map.set(g.id, g.name));
      const list = [...map.entries()].map(([id, name]) => ({ id, name }))
        .sort((a, b) => a.name.localeCompare(b.name));
      if (list.length) setGenres(list);
    });
    return () => { alive = false; };
  }, [tmdbGet]);

  const toggle = (id) => {
    const next = new Set(selected);
    next.has(id) ? next.delete(id) : next.add(id);
    setSelected(next);
  };

  // Open the detail drawer for an item and fetch full details + trailers.
  const openDetail = useCallback(async (item) => {
    setDetail(item); setDetailData(null); setDetailLoading(true);
    const media = item.media_type === "tv" ? "tv" : "movie";
    try {
      const r = await tmdbGet(`/${media}/${item.id}`, { append_to_response: "videos,credits" });
      const d = await r.json();
      if (d.status_code) throw new Error(d.status_message || "TMDB error");
      setDetailData(d);
    } catch (e) {
      setDetailData(null);
    } finally {
      setDetailLoading(false);
    }
  }, [tmdbGet]);

  const closeDetail = useCallback(() => {
    setDetail(null); setDetailData(null); setDetailLoading(false);
  }, []);

  // Close the drawer on Escape while it's open.
  useEffect(() => {
    if (!detail) return;
    const onKey = (e) => { if (e.key === "Escape") closeDetail(); };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [detail, closeDetail]);

  // Attach CA providers to each title across the allowed cost categories,
  // labelling each provider (Included / Free / Rent / Buy) and filtering by
  // the selected services.
  const enrich = useCallback(async (items) => {
    const cats = catsForFilter(costFilter);
    const out = [];
    for (const it of items) {
      const media = (it.media_type === "tv" || (!it.title && it.name)) ? "tv" : "movie";
      try {
        const r = await tmdbGet(`/${media}/${it.id}/watch/providers`);
        const d = await r.json();
        const ca = (d.results && d.results.CA) || {};
        // Pick, per provider, the best (cheapest) offer category that's allowed.
        const byProvider = new Map();
        for (const cat of cats) {
          for (const p of (ca[cat] || [])) {
            if (!selected.has(p.provider_id)) continue;
            const existing = byProvider.get(p.provider_id);
            if (!existing || PRIORITY.indexOf(cat) < PRIORITY.indexOf(existing._cat)) {
              byProvider.set(p.provider_id, { ...p, _cat: cat });
            }
          }
        }
        it._providers = [...byProvider.values()].map(p => ({
          ...p,
          offer: CAT_LABEL[p._cat],
          paid: PAID_CATS.includes(p._cat),
        }));
        it.media_type = media;
      } catch (e) {
        it._providers = [];
        it.media_type = media;
      }
      // Check the personal Plex library for a match (powers the badge + filter).
      // Cheap enough for the ≤20 results we render.
      if (plexEnabled) {
        const title = it.title || it.name;
        const date = it.release_date || it.first_air_date || "";
        it._onPlex = await isOnPlex(title, date.slice(0, 4), it.media_type);
      } else {
        it._onPlex = false;
      }
      out.push(it);
    }
    return out;
  }, [tmdbGet, selected, costFilter, plexEnabled]);

  const runSearch = useCallback(async () => {
    if (!useProxy && !apiKey) { setError("Enter your TMDB API key first."); return; }
    // Claim the latest request id. Any state write below is gated on this
    // still being current, so out-of-order responses are dropped.
    const myId = ++reqRef.current;
    const live = () => reqRef.current === myId;
    setTouched(true); setError(""); setLoading(true); setResults([]);
    // A title passes when it's on a selected streaming service, or — with the
    // Plex chip on — it's in your Plex library.
    const plexOn = selected.has(PLEX_ID);
    const passes = (x) => x._providers.length > 0 || (plexOn && x._onPlex);
    try {
      let items = [];
      if (mode === "search") {
        if (!query.trim()) { if (live()) setLoading(false); return; }
        const r = await tmdbGet(`/search/multi`, { query, region: REGION, include_adult: false });
        const d = await r.json();
        if (d.status_code) throw new Error(d.status_message || "TMDB error");
        items = (d.results || []).filter(x => x.media_type === "movie" || x.media_type === "tv").slice(0, 20);
        const enriched = await enrich(items);
        if (live()) setResults(enriched.filter(passes));
      } else if (mode === "browse") {
        // Browse: what's currently available on the selected services in Canada.
        // Discover is TMDB-only, so the Plex sentinel is excluded here.
        const tmdbIds = [...selected].filter(id => typeof id === "number");
        if (!tmdbIds.length) { if (live()) { setError("Select at least one streaming service to browse."); setLoading(false); } return; }
        const provParam = tmdbIds.join("|");
        const r = await tmdbGet(`/discover/movie`, { watch_region: REGION, with_watch_providers: provParam, with_watch_monetization_types: monetizationParam(costFilter), sort_by: "popularity.desc", page: 1 });
        const d = await r.json();
        if (d.status_code) throw new Error(d.status_message || "TMDB error");
        items = (d.results || []).slice(0, 20).map(x => ({ ...x, media_type: "movie" }));
        const enriched = await enrich(items);
        if (live()) setResults(enriched);
      } else if (mode === "upcoming") {
        // Upcoming: theatrical movie releases in Canada + TV shows whose first
        // air date is still in the future, merged and sorted by soonest. These
        // usually have no streaming providers yet, so we don't filter by
        // service — we just list them (badges still appear if TMDB has them).
        const today = new Date().toISOString().slice(0, 10);
        const [mr, tr] = await Promise.all([
          tmdbGet(`/movie/upcoming`, { region: REGION, page: 1 }),
          tmdbGet(`/discover/tv`, { watch_region: REGION, "first_air_date.gte": today, sort_by: "first_air_date.asc", page: 1 }),
        ]);
        const [md, td] = await Promise.all([mr.json(), tr.json()]);
        if (md.status_code) throw new Error(md.status_message || "TMDB error");
        const movies = (md.results || [])
          .filter(x => x.release_date && x.release_date >= today)
          .map(x => ({ ...x, media_type: "movie", _upcoming: x.release_date }));
        const shows = (td.results || [])
          .filter(x => x.first_air_date && x.first_air_date >= today)
          .map(x => ({ ...x, media_type: "tv", _upcoming: x.first_air_date }));
        items = [...movies, ...shows]
          .sort((a, b) => a._upcoming.localeCompare(b._upcoming))
          .slice(0, 20);
        const enriched = await enrich(items);
        if (live()) setResults(enriched);
      } else {
        // Trending: TMDB's most-searched / most-popular titles this week
        const r = await tmdbGet(`/trending/all/week`);
        const d = await r.json();
        if (d.status_code) throw new Error(d.status_message || "TMDB error");
        items = (d.results || []).filter(x => x.media_type === "movie" || x.media_type === "tv").slice(0, 20);
        const enriched = await enrich(items);
        if (live()) setResults(enriched.filter(passes));
      }
    } catch (e) {
      if (live()) setError(e.message || "Something went wrong.");
    } finally {
      if (live()) setLoading(false);
    }
  }, [apiKey, useProxy, mode, query, selected, costFilter, enrich, tmdbGet]);

  // Live partial search: run automatically (debounced) as the user types.
  useEffect(() => {
    if (mode !== "search") return;
    // Bumping reqRef invalidates any search still in flight so it can't write
    // stale results after the box is cleared.
    if (query.trim().length < 2) { reqRef.current++; setResults([]); setTouched(false); return; }
    const t = setTimeout(() => { runSearch(); }, 450);
    return () => clearTimeout(t);
  }, [query, mode, selected, costFilter, runSearch]);

  // Genre + min-score are applied here, at render time, so changing either
  // instantly refines the current results without a new fetch.
  const gid = genre ? Number(genre) : 0;
  const visible = results.filter(x =>
    (!gid || (x.genre_ids || []).includes(gid)) &&
    ((x.vote_average || 0) >= minScore)
  );

  return (
    <div className="wrap">
      <header>
        <h1><span className="leaf">🍁</span> CanaStream</h1>
        <p>Search titles streaming in Canada across Netflix, Disney+, Prime Video, Crave, Apple TV+, YouTube — and your own Plex library.</p>
      </header>

      <div className="tabs">
        <button className={mode === "search" ? "active" : ""} onClick={() => setMode("search")}>Search a title</button>
        <button className={mode === "browse" ? "active" : ""} onClick={() => setMode("browse")}>Browse by service</button>
        <button className={mode === "trending" ? "active" : ""} onClick={() => setMode("trending")}>Trending now</button>
        <button className={mode === "upcoming" ? "active" : ""} onClick={() => setMode("upcoming")}>Upcoming</button>
      </div>

      {mode === "search" && (
        <div className="searchrow">
          <input type="text" value={query} placeholder="Type part of a title… e.g. schit, dune, the bear"
                 onChange={e => setQuery(e.target.value)}
                 onKeyDown={e => e.key === "Enter" && runSearch()} />
          <button onClick={runSearch} disabled={loading}>Search</button>
        </div>
      )}

      <div className="costbar">
        <span className="lbl">Cost</span>
        <div className="seg">
          <button className={costFilter === "free" ? "active" : ""} onClick={() => setCostFilter("free")}>Included / free</button>
          <button className={costFilter === "paid" ? "active" : ""} onClick={() => setCostFilter("paid")}>Rent / buy</button>
          <button className={costFilter === "both" ? "active" : ""} onClick={() => setCostFilter("both")}>Both</button>
        </div>
      </div>

      <div className="costbar">
        <span className="lbl">Genre</span>
        <select className="sel" value={genre} onChange={e => setGenre(e.target.value)}>
          <option value="">All genres</option>
          {genres.map(g => <option key={g.id} value={g.id}>{g.name}</option>)}
        </select>
        <span className="lbl">Min score</span>
        <select className="sel" value={minScore} onChange={e => setMinScore(Number(e.target.value))}>
          <option value="0">Any</option>
          <option value="5">5+</option>
          <option value="6">6+</option>
          <option value="7">7+</option>
          <option value="8">8+</option>
        </select>
      </div>

      <div className="chips">
        {SERVICES.map(s => (
          <span key={s.id} className={"chip" + (selected.has(s.id) ? " on" : "")}
                onClick={() => toggle(s.id)}>
            {selected.has(s.id) ? "✓ " : ""}{s.name}
          </span>
        ))}
        {plexEnabled && (
          <span className={"chip plexchip" + (selected.has(PLEX_ID) ? " on" : "")}
                onClick={() => toggle(PLEX_ID)}>
            {selected.has(PLEX_ID) ? "✓ " : ""}▶ My Plex
          </span>
        )}
      </div>

      {mode === "browse" && (
        <div style={{ marginBottom: 16 }}>
          <button onClick={runSearch} disabled={loading}>Show popular titles on selected services</button>
        </div>
      )}

      {mode === "trending" && (
        <div style={{ marginBottom: 16 }}>
          <button onClick={runSearch} disabled={loading}>Show what's trending this week</button>
        </div>
      )}

      {mode === "upcoming" && (
        <div style={{ marginBottom: 16 }}>
          <button onClick={runSearch} disabled={loading}>Show upcoming releases</button>
        </div>
      )}

      {loading && <div className="status"><div className="spinner"></div>Searching Canadian availability…</div>}
      {error && <div className="status" style={{ color: "#ff6b6b" }}>{error}</div>}
      {!loading && !error && touched && visible.length === 0 && (
        <div className="status">{results.length > 0
          ? "No titles match the current genre / score filters."
          : (mode === "upcoming"
            ? "No upcoming titles found right now."
            : "No matches on the selected services in Canada.")}</div>
      )}

      <div className="grid">
        {visible.map(item => <Card key={(item.media_type || "m") + item.id} item={item} onOpen={openDetail} />)}
      </div>

      {!touched && !loading &&
        <div className="status">Pick your services and search.</div>}

      {detail && <Detail item={detail} data={detailData} loading={detailLoading} onClose={closeDetail} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
